name: Test Terraform options
on:
  workflow_dispatch:

jobs:
  test-tf-options:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal source folder
      - name: Create source folder
        run: mkdir -p /tmp/site && echo "<html></html>" > /tmp/site/index.html

      - name: Run action with Terraform options and invalid AWS credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIAIOSFODNN7EXAMPLE'
          aws_secret_access_key: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
          aws_default_region: 'us-east-1'
          aws_site_source_folder: '/tmp/site'
          tf_action: 'apply'
          tf_state_file_name: 'my-custom-tf-state'
          tf_state_file_name_append: 'unique'
          tf_state_bucket: 'my-org-my-repo-main-tf-state'
          tf_state_bucket_destroy: 'false'

      - name: Assert action ran with Terraform options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because AWS credentials are fake,
          # but it should NOT be skipped — it should attempt to run.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run (even if it fails due to fake AWS creds)"
            exit 1
          fi
          echo "PASS: action ran with Terraform options (outcome: $OUTCOME)"
