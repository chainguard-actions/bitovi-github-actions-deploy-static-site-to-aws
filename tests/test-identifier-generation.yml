name: Test identifier generation script
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal source folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site"
          echo "<html><body>Hello</body></html>" > "$GITHUB_WORKSPACE/site/index.html"

      # The action requires AWS creds; run it with fake creds to satisfy the lint
      # requirement that every test file has a uses: . step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIAFAKEACCESSKEYID1'
          aws_secret_access_key: 'fakesecretaccesskey0000000000000000000000'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-identifier-gen'
          aws_site_source_folder: 'site'
          tf_state_bucket: 'test-identifier-gen-tf-state'

      - name: Assert action ran (success or graceful failure with fake creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Set up fixture scripts
        run: |
          # Use fixture scripts committed to the repo (not symlinks to host paths)
          FIXTURE_SCRIPTS="$GITHUB_WORKSPACE/tests/fixtures/scripts"
          mkdir -p /tmp/test-scripts-id
          cp "$FIXTURE_SCRIPTS/generate_identifier.sh" /tmp/test-scripts-id/generate_identifier.sh
          chmod +x /tmp/test-scripts-id/generate_identifier.sh

      - name: Test default identifier generation (from GITHUB_REPOSITORY + GITHUB_REF_NAME)
        env:
          GITHUB_REPOSITORY: 'myorg/myrepo'
          GITHUB_REF_NAME: 'main'
          GITHUB_HEAD_REF: ''
          AWS_RESOURCE_IDENTIFIER: ''
        run: |
          RESULT=$(bash /tmp/test-scripts-id/generate_identifier.sh)
          echo "result: $RESULT"
          if [ "$RESULT" != "myorg-myrepo-main" ]; then
            echo "FAIL: expected 'myorg-myrepo-main', got '$RESULT'"
            exit 1
          fi
          echo "PASS"

      - name: Test custom resource identifier override
        env:
          GITHUB_REPOSITORY: 'myorg/myrepo'
          GITHUB_REF_NAME: 'main'
          GITHUB_HEAD_REF: ''
          AWS_RESOURCE_IDENTIFIER: 'my-custom-identifier'
        run: |
          RESULT=$(bash /tmp/test-scripts-id/generate_identifier.sh)
          echo "result: $RESULT"
          if [ "$RESULT" != "my-custom-identifier" ]; then
            echo "FAIL: expected 'my-custom-identifier', got '$RESULT'"
            exit 1
          fi
          echo "PASS"

      - name: Test identifier with PR branch (GITHUB_HEAD_REF takes precedence)
        env:
          GITHUB_REPOSITORY: 'myorg/myrepo'
          GITHUB_REF_NAME: 'refs/pull/42/merge'
          GITHUB_HEAD_REF: 'feature-branch'
          AWS_RESOURCE_IDENTIFIER: ''
        run: |
          RESULT=$(bash /tmp/test-scripts-id/generate_identifier.sh)
          echo "result: $RESULT"
          if [ "$RESULT" != "myorg-myrepo-feature-branch" ]; then
            echo "FAIL: expected 'myorg-myrepo-feature-branch', got '$RESULT'"
            exit 1
          fi
          echo "PASS"

      - name: Test identifier is lowercased and underscores converted to dashes
        env:
          GITHUB_REPOSITORY: 'MyOrg/MyRepo'
          GITHUB_REF_NAME: 'My_Branch'
          GITHUB_HEAD_REF: ''
          AWS_RESOURCE_IDENTIFIER: ''
        run: |
          RESULT=$(bash /tmp/test-scripts-id/generate_identifier.sh)
          echo "result: $RESULT"
          # Should be lowercased and underscores replaced with dashes
          if echo "$RESULT" | grep -q '[A-Z_]'; then
            echo "FAIL: identifier contains uppercase or underscores: '$RESULT'"
            exit 1
          fi
          echo "PASS: identifier is '$RESULT'"

      - name: Test short identifier generation (30 char limit)
        env:
          GITHUB_REPOSITORY: 'myorg/myrepo'
          GITHUB_REF_NAME: 'main'
          GITHUB_HEAD_REF: ''
          AWS_RESOURCE_IDENTIFIER: ''
        run: |
          RESULT=$(bash /tmp/test-scripts-id/generate_identifier.sh 30)
          echo "result: $RESULT"
          LEN=${#RESULT}
          echo "length: $LEN"
          if [ "$LEN" -gt 30 ]; then
            echo "FAIL: short identifier exceeds 30 chars: '$RESULT' ($LEN chars)"
            exit 1
          fi
          echo "PASS"

      - name: Test long identifier is shortened to default 60 chars
        env:
          GITHUB_REPOSITORY: 'verylongorganizationname/verylongrepositorynamethatexceedslimits'
          GITHUB_REF_NAME: 'very-long-branch-name-that-makes-the-identifier-exceed-the-limit'
          GITHUB_HEAD_REF: ''
          AWS_RESOURCE_IDENTIFIER: ''
        run: |
          RESULT=$(bash /tmp/test-scripts-id/generate_identifier.sh)
          echo "result: $RESULT"
          LEN=${#RESULT}
          echo "length: $LEN"
          if [ "$LEN" -gt 60 ]; then
            echo "FAIL: identifier exceeds 60 chars: '$RESULT' ($LEN chars)"
            exit 1
          fi
          echo "PASS"
