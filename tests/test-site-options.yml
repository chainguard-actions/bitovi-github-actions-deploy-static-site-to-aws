name: Test site options and additional AWS inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: myorg/myrepo
      GITHUB_REF_NAME: main
      GITHUB_HEAD_REF: ""
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with site options and additional AWS inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
          aws_default_region: us-east-1
          aws_role_to_assume: arn:aws:iam::123456789012:role/MyRole
          aws_resource_identifier: my-custom-identifier
          aws_additional_tags: '{"env":"test","team":"devops"}'
          aws_site_source_folder: .
          aws_site_source_include_hidden: 'false'
          aws_site_root_object: index.html
          aws_site_error_document: error.html
          aws_site_bucket_name: my-custom-site-bucket
          tf_action: plan
          tf_state_bucket_destroy: 'false'

      - name: Assert action.yml contains aws_role_to_assume input
        run: |
          if ! grep -q 'aws_role_to_assume' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain aws_role_to_assume input"
            exit 1
          fi
          echo "PASS: aws_role_to_assume input is defined"

      - name: Assert action.yml contains aws_resource_identifier input
        run: |
          if ! grep -q 'aws_resource_identifier' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain aws_resource_identifier input"
            exit 1
          fi
          echo "PASS: aws_resource_identifier input is defined"

      - name: Assert action.yml contains aws_additional_tags input
        run: |
          if ! grep -q 'aws_additional_tags' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain aws_additional_tags input"
            exit 1
          fi
          echo "PASS: aws_additional_tags input is defined"

      - name: Assert action.yml contains aws_site_root_object input
        run: |
          if ! grep -q 'aws_site_root_object' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain aws_site_root_object input"
            exit 1
          fi
          echo "PASS: aws_site_root_object input is defined"

      - name: Assert action.yml contains aws_site_error_document input
        run: |
          if ! grep -q 'aws_site_error_document' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain aws_site_error_document input"
            exit 1
          fi
          echo "PASS: aws_site_error_document input is defined"

      - name: Assert action.yml contains aws_site_bucket_name input
        run: |
          if ! grep -q 'aws_site_bucket_name' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain aws_site_bucket_name input"
            exit 1
          fi
          echo "PASS: aws_site_bucket_name input is defined"

      - name: Assert action.yml contains aws_site_source_include_hidden input
        run: |
          if ! grep -q 'aws_site_source_include_hidden' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain aws_site_source_include_hidden input"
            exit 1
          fi
          echo "PASS: aws_site_source_include_hidden input is defined"

      - name: Assert action.yml contains tf_action input
        run: |
          if ! grep -q 'tf_action' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain tf_action input"
            exit 1
          fi
          echo "PASS: tf_action input is defined"

      - name: Assert action.yml contains tf_state_bucket_destroy input
        run: |
          if ! grep -q 'tf_state_bucket_destroy' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain tf_state_bucket_destroy input"
            exit 1
          fi
          echo "PASS: tf_state_bucket_destroy input is defined"

      - name: Assert generate_deploy.sh exists and is executable
        run: |
          if [ ! -x "$GITHUB_WORKSPACE/scripts/generate_deploy.sh" ]; then
            echo "FAIL: generate_deploy.sh is not executable"
            exit 1
          fi
          echo "PASS: generate_deploy.sh exists and is executable"
