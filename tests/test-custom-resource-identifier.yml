name: Test custom resource identifier
on:
  workflow_dispatch:

jobs:
  test-custom-resource-identifier:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal source folder so rsync in generate_deploy.sh doesn't fail
      - name: Create source folder
        run: mkdir -p /tmp/site && echo "<html></html>" > /tmp/site/index.html

      - name: Run action with custom resource identifier and invalid AWS credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIAIOSFODNN7EXAMPLE'
          aws_secret_access_key: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'my-custom-site-id'
          aws_site_source_folder: '/tmp/site'

      - name: Assert action ran with custom identifier
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because AWS credentials are fake,
          # but it should NOT fail because of the custom resource identifier.
          # The action will fail at the AWS credential configuration or S3 bucket creation step.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with custom resource identifier (outcome: $OUTCOME)"
