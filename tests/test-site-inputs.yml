name: Test site and AWS resource inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: myorg/myrepo
      GITHUB_REF_NAME: main
      GITHUB_HEAD_REF: ""
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with site and resource inputs (will fail at Terraform without real AWS creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
          aws_default_region: us-east-1
          aws_role_to_assume: arn:aws:iam::123456789012:role/my-deploy-role
          aws_resource_identifier: my-custom-identifier
          aws_additional_tags: '{"env": "test", "team": "platform"}'
          aws_site_source_folder: .
          aws_site_source_include_hidden: 'false'
          aws_site_bucket_name: my-custom-site-bucket
          aws_site_root_object: index.html
          aws_site_error_document: error.html

      - name: Run generate_deploy.sh with site and resource inputs
        id: generate_deploy
        env:
          GITHUB_ACTION_PATH: "${{ github.workspace }}"
          GITHUB_REPOSITORY: myorg/myrepo
          GITHUB_REF_NAME: main
          GITHUB_HEAD_REF: ""
          AWS_DEFAULT_REGION: us-east-1
          AWS_RESOURCE_IDENTIFIER: my-custom-identifier
          AWS_ADDITIONAL_TAGS: '{"env": "test", "team": "platform"}'
          TF_STATE_BUCKET: myorg-myrepo-main-tf-state
          TF_STATE_FILE_NAME: ""
          TF_STATE_FILE_NAME_APPEND: ""
          AWS_SITE_SOURCE_FOLDER: .
          AWS_SITE_SOURCE_INCLUDE_HIDDEN: "false"
          AWS_SITE_ROOT_OBJECT: index.html
          AWS_SITE_ERROR_DOCUMENT: error.html
          AWS_SITE_BUCKET_NAME: my-custom-site-bucket
          AWS_SITE_CDN_ENABLED: ""
          AWS_SITE_CDN_ALIASES: ""
          AWS_SITE_CDN_CUSTOM_ERROR_CODES: ""
          AWS_SITE_CDN_RESPONSE_HEADERS_POLICY_ID: ""
          AWS_SITE_CDN_MIN_TTL: ""
          AWS_SITE_CDN_DEFAULT_TTL: ""
          AWS_SITE_CDN_MAX_TTL: ""
          AWS_R53_DOMAIN_NAME: ""
          AWS_R53_SUB_DOMAIN_NAME: ""
          AWS_R53_ROOT_DOMAIN_DEPLOY: ""
          AWS_R53_CERT_ARN: ""
          AWS_R53_CREATE_ROOT_CERT: ""
          AWS_R53_CREATE_SUB_CERT: ""
        run: |
          bash "$GITHUB_WORKSPACE/scripts/generate_deploy.sh" || true

      - name: Assert terraform.tfvars contains custom site bucket name
        run: |
          TFVARS="$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
          echo "Contents of terraform.tfvars:"
          cat "$TFVARS"
          if ! grep -q 'aws_site_bucket_name.*=.*"my-custom-site-bucket"' "$TFVARS"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_site_bucket_name"
            exit 1
          fi
          echo "PASS: aws_site_bucket_name is correct"

      - name: Assert terraform.tfvars contains root object
        run: |
          TFVARS="$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_site_root_object.*=.*"index.html"' "$TFVARS"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_site_root_object"
            exit 1
          fi
          echo "PASS: aws_site_root_object is correct"

      - name: Assert terraform.tfvars contains error document
        run: |
          TFVARS="$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_site_error_document.*=.*"error.html"' "$TFVARS"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_site_error_document"
            exit 1
          fi
          echo "PASS: aws_site_error_document is correct"

      - name: Assert terraform.tfvars contains custom resource identifier
        run: |
          TFVARS="$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_resource_identifier.*=.*"my-custom-identifier"' "$TFVARS"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_resource_identifier"
            exit 1
          fi
          echo "PASS: aws_resource_identifier is correct"

      - name: Assert terraform.tfvars contains additional tags
        run: |
          TFVARS="$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_additional_tags' "$TFVARS"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_additional_tags"
            exit 1
          fi
          echo "PASS: aws_additional_tags is present"

      - name: Assert action.yaml has aws_role_to_assume input
        run: |
          if ! grep -q 'aws_role_to_assume' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain aws_role_to_assume input"
            exit 1
          fi
          echo "PASS: aws_role_to_assume input is defined in action.yaml"

      - name: Assert action.yaml has aws_site_source_include_hidden input
        run: |
          if ! grep -q 'aws_site_source_include_hidden' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain aws_site_source_include_hidden input"
            exit 1
          fi
          echo "PASS: aws_site_source_include_hidden input is defined in action.yaml"
