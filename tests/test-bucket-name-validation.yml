name: Test bucket name validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal source folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site"
          echo "<html><body>Hello</body></html>" > "$GITHUB_WORKSPACE/site/index.html"

      # The action requires AWS creds; run it with fake creds to satisfy the lint
      # requirement that every test file has a uses: . step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIAFAKEACCESSKEYID1'
          aws_secret_access_key: 'fakesecretaccesskey0000000000000000000000'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-bucket-validation'
          aws_site_source_folder: 'site'
          tf_state_bucket: 'test-bucket-validation-tf-state'

      - name: Assert action ran (success or graceful failure with fake creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Set up fixture scripts
        run: |
          # Use fixture scripts committed to the repo (not symlinks to host paths)
          FIXTURE_SCRIPTS="$GITHUB_WORKSPACE/tests/fixtures/scripts"
          mkdir -p /tmp/test-scripts-bucket
          cp "$FIXTURE_SCRIPTS/check_bucket_name.sh" /tmp/test-scripts-bucket/check_bucket_name.sh
          cp "$FIXTURE_SCRIPTS/generate_identifier.sh" /tmp/test-scripts-bucket/generate_identifier.sh
          chmod +x /tmp/test-scripts-bucket/check_bucket_name.sh
          chmod +x /tmp/test-scripts-bucket/generate_identifier.sh

      - name: Test valid bucket name passes validation
        run: |
          BUCKET_NAME="valid-bucket-name-under-63-chars"
          echo "Testing bucket name: $BUCKET_NAME (${#BUCKET_NAME} chars)"
          bash /tmp/test-scripts-bucket/check_bucket_name.sh "$BUCKET_NAME"
          echo "PASS: valid bucket name passed validation"

      - name: Test bucket name at exactly 63 chars passes validation
        run: |
          # Generate a 63-character bucket name (all lowercase letters and hyphens)
          BUCKET_NAME="$(printf 'a%.0s' {1..31})-$(printf 'b%.0s' {1..31})"
          echo "Testing bucket name: $BUCKET_NAME (${#BUCKET_NAME} chars)"
          bash /tmp/test-scripts-bucket/check_bucket_name.sh "$BUCKET_NAME"
          echo "PASS: 63-char bucket name passed validation"

      - name: Test bucket name exceeding 63 chars fails validation
        run: |
          # Generate a 64-character bucket name (exceeds limit)
          BUCKET_NAME="$(printf 'a%.0s' {1..32})-$(printf 'b%.0s' {1..31})"
          echo "Testing bucket name: $BUCKET_NAME (${#BUCKET_NAME} chars)"
          bash /tmp/test-scripts-bucket/check_bucket_name.sh "$BUCKET_NAME" && EXIT_CODE=0 || EXIT_CODE=$?
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "FAIL: oversized bucket name should have failed validation"
            exit 1
          fi
          echo "PASS: oversized bucket name correctly rejected (exit code $EXIT_CODE)"

      - name: Test bucket name with uppercase letters fails validation
        run: |
          BUCKET_NAME="Invalid-Bucket-Name"
          echo "Testing bucket name: $BUCKET_NAME"
          bash /tmp/test-scripts-bucket/check_bucket_name.sh "$BUCKET_NAME" && EXIT_CODE=0 || EXIT_CODE=$?
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "FAIL: bucket name with uppercase should have failed validation"
            exit 1
          fi
          echo "PASS: uppercase bucket name correctly rejected"

      - name: Test bucket name starting with xn-- fails validation
        run: |
          BUCKET_NAME="xn--invalid-bucket"
          echo "Testing bucket name: $BUCKET_NAME"
          bash /tmp/test-scripts-bucket/check_bucket_name.sh "$BUCKET_NAME" && EXIT_CODE=0 || EXIT_CODE=$?
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "FAIL: bucket name starting with xn-- should have failed validation"
            exit 1
          fi
          echo "PASS: xn-- prefix bucket name correctly rejected"

      - name: Test bucket name ending with -s3alias fails validation
        run: |
          BUCKET_NAME="my-bucket-s3alias"
          echo "Testing bucket name: $BUCKET_NAME"
          bash /tmp/test-scripts-bucket/check_bucket_name.sh "$BUCKET_NAME" && EXIT_CODE=0 || EXIT_CODE=$?
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "FAIL: bucket name ending with -s3alias should have failed validation"
            exit 1
          fi
          echo "PASS: -s3alias suffix bucket name correctly rejected"

      - name: Test bucket name formatted as IP address fails validation
        run: |
          BUCKET_NAME="192.168.1.100"
          echo "Testing bucket name: $BUCKET_NAME"
          bash /tmp/test-scripts-bucket/check_bucket_name.sh "$BUCKET_NAME" && EXIT_CODE=0 || EXIT_CODE=$?
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "FAIL: IP-address-formatted bucket name should have failed validation"
            exit 1
          fi
          echo "PASS: IP-address-formatted bucket name correctly rejected"

      - name: Test bucket name with adjacent periods fails validation
        run: |
          BUCKET_NAME="my..bucket"
          echo "Testing bucket name: $BUCKET_NAME"
          bash /tmp/test-scripts-bucket/check_bucket_name.sh "$BUCKET_NAME" && EXIT_CODE=0 || EXIT_CODE=$?
          echo "exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "FAIL: bucket name with adjacent periods should have failed validation"
            exit 1
          fi
          echo "PASS: adjacent periods bucket name correctly rejected"

      - name: Test auto-generated TF state bucket name stays within limits
        env:
          GITHUB_REPOSITORY: 'testorg/testrepo'
          GITHUB_REF_NAME: 'main'
          GITHUB_HEAD_REF: ''
          AWS_RESOURCE_IDENTIFIER: 'test-bucket-validation'
        run: |
          GITHUB_IDENTIFIER=$(bash /tmp/test-scripts-bucket/generate_identifier.sh)
          echo "GITHUB_IDENTIFIER: $GITHUB_IDENTIFIER"

          MIN_BUCKET_NAME_FOR_TF_STATE_SUFFIX=55
          if [[ ${#GITHUB_IDENTIFIER} -lt $MIN_BUCKET_NAME_FOR_TF_STATE_SUFFIX ]]; then
            TF_STATE_BUCKET="${GITHUB_IDENTIFIER}-tf-state"
          else
            TF_STATE_BUCKET="${GITHUB_IDENTIFIER}-tf"
          fi
          echo "TF_STATE_BUCKET: $TF_STATE_BUCKET (${#TF_STATE_BUCKET} chars)"

          bash /tmp/test-scripts-bucket/check_bucket_name.sh "$TF_STATE_BUCKET"
          echo "PASS: auto-generated TF state bucket name is valid"
