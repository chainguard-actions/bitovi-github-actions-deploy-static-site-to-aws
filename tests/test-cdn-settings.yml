name: Test CDN settings inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: myorg/myrepo
      GITHUB_REF_NAME: main
      GITHUB_HEAD_REF: ""
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with CDN settings (will fail at Terraform without real AWS creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
          aws_default_region: us-east-1
          aws_site_source_folder: .
          aws_site_cdn_enabled: 'true'
          aws_site_cdn_aliases: cdn.example.com
          aws_site_cdn_custom_error_codes: '{"403":{"response_code":200,"response_page_path":"/index.html"}}'
          aws_site_cdn_response_headers_policy_id: 67f7725c-6f97-4210-82d7-5512b31e9d42
          aws_site_cdn_min_ttl: '0'
          aws_site_cdn_default_ttl: '86400'
          aws_site_cdn_max_ttl: '31536000'

      - name: Run generate_deploy.sh with CDN settings
        id: deploy_gen
        env:
          GITHUB_ACTION_PATH: "${{ github.workspace }}"
          GITHUB_REPOSITORY: myorg/myrepo
          GITHUB_REF_NAME: main
          GITHUB_HEAD_REF: ""
          AWS_DEFAULT_REGION: us-east-1
          AWS_RESOURCE_IDENTIFIER: ""
          AWS_ADDITIONAL_TAGS: ""
          TF_STATE_BUCKET: myorg-myrepo-main-tf-state
          TF_STATE_FILE_NAME: ""
          TF_STATE_FILE_NAME_APPEND: ""
          AWS_SITE_SOURCE_FOLDER: .
          AWS_SITE_SOURCE_INCLUDE_HIDDEN: ""
          AWS_SITE_ROOT_OBJECT: ""
          AWS_SITE_ERROR_DOCUMENT: ""
          AWS_SITE_BUCKET_NAME: ""
          AWS_SITE_CDN_ENABLED: "true"
          AWS_SITE_CDN_ALIASES: "cdn.example.com"
          AWS_SITE_CDN_CUSTOM_ERROR_CODES: '{"403":{"response_code":200}}'
          AWS_SITE_CDN_RESPONSE_HEADERS_POLICY_ID: "67f7725c-6f97-4210-82d7-5512b31e9d42"
          AWS_SITE_CDN_MIN_TTL: "0"
          AWS_SITE_CDN_DEFAULT_TTL: "86400"
          AWS_SITE_CDN_MAX_TTL: "31536000"
          AWS_R53_DOMAIN_NAME: ""
          AWS_R53_SUB_DOMAIN_NAME: ""
          AWS_R53_ROOT_DOMAIN_DEPLOY: ""
          AWS_R53_CERT_ARN: ""
          AWS_R53_CREATE_ROOT_CERT: ""
          AWS_R53_CREATE_SUB_CERT: ""
        run: |
          # create_tf_state_bucket.sh would try to create a real bucket; stub it out
          mkdir -p "$GITHUB_WORKSPACE/scripts_bak"
          cp "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh" "$GITHUB_WORKSPACE/scripts_bak/"
          echo '#!/bin/bash' > "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh"
          echo 'echo "Stubbed create_tf_state_bucket.sh"' >> "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh"
          chmod +x "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh"
          bash "$GITHUB_WORKSPACE/scripts/generate_deploy.sh"
          # restore
          cp "$GITHUB_WORKSPACE/scripts_bak/create_tf_state_bucket.sh" "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh"

      - name: Assert terraform.tfvars contains CDN enabled
        run: |
          echo "Contents of terraform.tfvars:"
          cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_site_cdn_enabled.*=.*true' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_site_cdn_enabled = true"
            exit 1
          fi
          echo "PASS: aws_site_cdn_enabled is set correctly"

      - name: Assert terraform.tfvars contains CDN aliases
        run: |
          if ! grep -q 'aws_site_cdn_aliases.*=.*"cdn.example.com"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_site_cdn_aliases"
            exit 1
          fi
          echo "PASS: aws_site_cdn_aliases is set correctly"

      - name: Assert terraform.tfvars contains CDN response headers policy ID
        run: |
          if ! grep -q 'aws_site_cdn_response_headers_policy_id.*=.*"67f7725c' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_site_cdn_response_headers_policy_id"
            exit 1
          fi
          echo "PASS: aws_site_cdn_response_headers_policy_id is set correctly"

      - name: Assert terraform.tfvars contains CDN TTL values
        run: |
          if ! grep -q 'aws_site_cdn_min_ttl.*=.*"0"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_site_cdn_min_ttl"
            exit 1
          fi
          if ! grep -q 'aws_site_cdn_default_ttl.*=.*"86400"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_site_cdn_default_ttl"
            exit 1
          fi
          if ! grep -q 'aws_site_cdn_max_ttl.*=.*"31536000"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_site_cdn_max_ttl"
            exit 1
          fi
          echo "PASS: CDN TTL values are set correctly"
