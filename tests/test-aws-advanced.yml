name: Test advanced AWS inputs (resource identifier, role, tags)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: myorg/myrepo
      GITHUB_REF_NAME: main
      GITHUB_HEAD_REF: ""
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with advanced AWS inputs (will fail at Terraform without real AWS creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
          aws_default_region: us-east-1
          aws_role_to_assume: arn:aws:iam::123456789012:role/MyDeployRole
          aws_resource_identifier: my-custom-resource-id
          aws_additional_tags: '{"environment":"test","team":"devops"}'
          aws_site_source_folder: .

      - name: Run generate_deploy.sh with custom resource identifier and tags
        env:
          GITHUB_ACTION_PATH: "${{ github.workspace }}"
          GITHUB_REPOSITORY: myorg/myrepo
          GITHUB_REF_NAME: main
          GITHUB_HEAD_REF: ""
          AWS_DEFAULT_REGION: us-east-1
          AWS_RESOURCE_IDENTIFIER: "my-custom-resource-id"
          AWS_ADDITIONAL_TAGS: '{"environment":"test","team":"devops"}'
          TF_STATE_BUCKET: myorg-myrepo-main-tf-state
          TF_STATE_FILE_NAME: ""
          TF_STATE_FILE_NAME_APPEND: ""
          AWS_SITE_SOURCE_FOLDER: .
          AWS_SITE_SOURCE_INCLUDE_HIDDEN: ""
          AWS_SITE_ROOT_OBJECT: ""
          AWS_SITE_ERROR_DOCUMENT: ""
          AWS_SITE_BUCKET_NAME: ""
          AWS_SITE_CDN_ENABLED: ""
          AWS_SITE_CDN_ALIASES: ""
          AWS_SITE_CDN_CUSTOM_ERROR_CODES: ""
          AWS_SITE_CDN_RESPONSE_HEADERS_POLICY_ID: ""
          AWS_SITE_CDN_MIN_TTL: ""
          AWS_SITE_CDN_DEFAULT_TTL: ""
          AWS_SITE_CDN_MAX_TTL: ""
          AWS_R53_DOMAIN_NAME: ""
          AWS_R53_SUB_DOMAIN_NAME: ""
          AWS_R53_ROOT_DOMAIN_DEPLOY: ""
          AWS_R53_CERT_ARN: ""
          AWS_R53_CREATE_ROOT_CERT: ""
          AWS_R53_CREATE_SUB_CERT: ""
        run: |
          # Stub out create_tf_state_bucket.sh to avoid real AWS calls
          mkdir -p "$GITHUB_WORKSPACE/scripts_bak"
          cp "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh" "$GITHUB_WORKSPACE/scripts_bak/"
          echo '#!/bin/bash' > "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh"
          echo 'echo "Stubbed create_tf_state_bucket.sh"' >> "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh"
          chmod +x "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh"
          bash "$GITHUB_WORKSPACE/scripts/generate_deploy.sh"
          # restore
          cp "$GITHUB_WORKSPACE/scripts_bak/create_tf_state_bucket.sh" "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh"

      - name: Assert terraform.tfvars contains custom resource identifier
        run: |
          echo "Contents of terraform.tfvars:"
          cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_resource_identifier.*=.*"my-custom-resource-id"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_resource_identifier = my-custom-resource-id"
            exit 1
          fi
          echo "PASS: aws_resource_identifier is set correctly"

      - name: Assert terraform.tfvars contains additional tags
        run: |
          if ! grep -q 'aws_additional_tags' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_additional_tags"
            exit 1
          fi
          echo "PASS: aws_additional_tags is present in terraform.tfvars"

      - name: Assert action.yml contains aws_role_to_assume input
        run: |
          # Verify the action.yaml declares the aws_role_to_assume input
          if ! grep -q 'aws_role_to_assume' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not declare aws_role_to_assume input"
            exit 1
          fi
          echo "PASS: action.yaml declares aws_role_to_assume input"

      - name: Assert action.yml passes role-to-assume to configure-aws-credentials
        run: |
          # Verify the action.yaml passes role-to-assume to the AWS credentials step
          if ! grep -q 'role-to-assume' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not pass role-to-assume to configure-aws-credentials"
            exit 1
          fi
          echo "PASS: action.yaml passes role-to-assume to configure-aws-credentials"
