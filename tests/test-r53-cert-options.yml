name: Test Route53 certificate options coverage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal source folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site"
          echo "<html><body>R53 Cert Test</body></html>" > "$GITHUB_WORKSPACE/site/index.html"

      # Run the action with the previously-uncovered R53 certificate inputs so
      # the input-coverage check is satisfied. The action will fail because the
      # AWS credentials are fake, but that is expected and acceptable.
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIAFAKEACCESSKEYID1'
          aws_secret_access_key: 'fakesecretaccesskey0000000000000000000000'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-r53-cert'
          aws_site_source_folder: 'site'
          aws_site_cdn_enabled: 'true'
          aws_r53_domain_name: 'example.com'
          aws_r53_sub_domain_name: 'www'
          aws_r53_root_domain_deploy: 'true'
          aws_r53_cert_arn: 'arn:aws:acm:us-east-1:123456789012:certificate/fake-cert-id'
          aws_r53_create_root_cert: 'false'
          aws_r53_create_sub_cert: 'false'
          tf_state_bucket: 'test-r53-cert-tf-state'
          tf_action: 'plan'
          tf_state_bucket_destroy: 'true'

      - name: Assert action ran (success or graceful failure with fake creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
