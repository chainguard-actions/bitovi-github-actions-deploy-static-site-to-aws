name: Test basic inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify action.yml exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          echo "PASS: action.yml found"
      - name: Verify inputs are declared in action.yml
        run: |
          required_inputs=(
            "aws_access_key_id"
            "aws_secret_access_key"
            "aws_resource_identifier"
            "aws_role_to_assume"
            "aws_additional_tags"
            "aws_site_source_folder"
            "aws_site_source_include_hidden"
            "aws_site_root_object"
            "aws_site_error_document"
            "aws_site_bucket_name"
            "tf_state_file_name"
            "tf_state_file_name_append"
            "tf_state_bucket"
            "tf_action"
            "tf_state_bucket_destroy"
          )
          for input in "${required_inputs[@]}"; do
            if ! grep -q "$input" "$GITHUB_WORKSPACE/action.yml"; then
              echo "FAIL: input '$input' not found in action.yml"
              exit 1
            fi
          done
          echo "PASS: all required inputs declared"
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIAIOSFODNN7EXAMPLE'
          aws_secret_access_key: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-org-test-repo-main'
          aws_role_to_assume: ''
          aws_additional_tags: '{"env":"test","project":"static-site"}'
          aws_site_source_folder: 'dist'
          aws_site_source_include_hidden: 'false'
          aws_site_root_object: 'index.html'
          aws_site_error_document: '404.html'
          aws_site_bucket_name: 'test-static-site-bucket'
          tf_state_file_name: 'tf-state-static-site'
          tf_state_file_name_append: 'unique'
          tf_state_bucket: 'test-tf-state-bucket'
          tf_action: 'plan'
          tf_state_bucket_destroy: 'false'
      - name: Assert action ran (may fail due to no real AWS creds)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (outcome may be failure due to missing AWS credentials in test environment)"
