name: Test Terraform action and state bucket destroy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: myorg/myrepo
      GITHUB_REF_NAME: main
      GITHUB_HEAD_REF: ""
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with tf_action=apply (will fail at Terraform without real AWS creds)
        id: action_apply
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
          aws_default_region: us-east-1
          aws_site_source_folder: .
          tf_action: apply
          tf_state_bucket_destroy: 'false'

      - name: Assert action ran (apply scenario)
        env:
          OUTCOME: ${{ steps.action_apply.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with tf_action=apply (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Invoke action with tf_action=destroy (will fail at Terraform without real AWS creds)
        id: action_destroy
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
          aws_default_region: us-east-1
          aws_site_source_folder: .
          tf_action: destroy
          tf_state_bucket_destroy: 'true'

      - name: Assert action ran (destroy scenario)
        env:
          OUTCOME: ${{ steps.action_destroy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with tf_action=destroy (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert action.yaml has tf_action input
        run: |
          if ! grep -q 'tf_action:' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain tf_action input"
            exit 1
          fi
          echo "PASS: tf_action input is defined in action.yaml"

      - name: Assert action.yaml has tf_state_bucket_destroy input
        run: |
          if ! grep -q 'tf_state_bucket_destroy:' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain tf_state_bucket_destroy input"
            exit 1
          fi
          echo "PASS: tf_state_bucket_destroy input is defined in action.yaml"

      - name: Assert action.yaml has destroy conditional for Terraform Destroy step
        run: |
          if ! grep -q "inputs.tf_action == 'destroy'" "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain destroy conditional"
            exit 1
          fi
          echo "PASS: action.yaml has destroy conditional"

      - name: Assert action.yaml has apply conditional for Terraform Apply step
        run: |
          if ! grep -q "inputs.tf_action == 'apply'" "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain apply conditional"
            exit 1
          fi
          echo "PASS: action.yaml has apply conditional"
