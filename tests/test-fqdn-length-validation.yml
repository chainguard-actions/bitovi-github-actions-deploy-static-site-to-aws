name: Test FQDN length validation
on:
  workflow_dispatch:

jobs:
  test-fqdn-length-validation:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal source folder so rsync in generate_deploy.sh doesn't fail
      - name: Create source folder
        run: mkdir -p /tmp/site && echo "<html></html>" > /tmp/site/index.html

      - name: Run action with FQDN exceeding 64 chars and cert creation enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'fake-key-id'
          aws_secret_access_key: 'fake-secret-key'
          aws_default_region: 'us-east-1'
          aws_site_source_folder: '/tmp/site'
          aws_r53_domain_name: 'example.com'
          # This subdomain + domain = "this-is-a-very-long-subdomain-name-that-exceeds-the-limit.example.com" > 64 chars
          aws_r53_sub_domain_name: 'this-is-a-very-long-subdomain-name-that-exceeds-the-limit'
          aws_r53_create_sub_cert: 'true'

      - name: Assert action failed due to FQDN length
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to FQDN length exceeding 64 characters"
            exit 1
          fi
          echo "PASS: action correctly failed when FQDN exceeds 64 characters with cert creation enabled"
