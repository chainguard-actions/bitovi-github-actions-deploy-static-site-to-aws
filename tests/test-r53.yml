name: Test Route53 inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify Route53 inputs are declared in action.yml
        run: |
          r53_inputs=(
            "aws_r53_domain_name"
            "aws_r53_sub_domain_name"
            "aws_r53_root_domain_deploy"
            "aws_r53_cert_arn"
            "aws_r53_create_root_cert"
            "aws_r53_create_sub_cert"
          )
          for input in "${r53_inputs[@]}"; do
            if ! grep -q "$input" "$GITHUB_WORKSPACE/action.yml"; then
              echo "FAIL: Route53 input '$input' not found in action.yml"
              exit 1
            fi
          done
          echo "PASS: all Route53 inputs declared"
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIAIOSFODNN7EXAMPLE'
          aws_secret_access_key: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
          aws_default_region: 'us-east-1'
          aws_site_source_folder: 'dist'
          aws_r53_domain_name: 'example.com'
          aws_r53_sub_domain_name: 'app'
          aws_r53_root_domain_deploy: 'false'
          aws_r53_cert_arn: 'arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012'
          aws_r53_create_root_cert: 'false'
          aws_r53_create_sub_cert: 'true'
          tf_action: 'plan'
      - name: Assert action ran (may fail due to no real AWS creds)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: Route53 action step executed (outcome may be failure due to missing AWS credentials in test environment)"
