name: Test CDN and Route53 configuration generation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal source folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site"
          echo "<html><body>CDN Test</body></html>" > "$GITHUB_WORKSPACE/site/index.html"

      # The action requires AWS creds; run it with fake creds to satisfy the lint
      # requirement that every test file has a uses: . step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIAFAKEACCESSKEYID1'
          aws_secret_access_key: 'fakesecretaccesskey0000000000000000000000'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-cdn-r53'
          aws_site_source_folder: 'site'
          tf_state_bucket: 'test-cdn-r53-tf-state'
          aws_site_cdn_enabled: 'true'
          aws_r53_domain_name: 'example.com'
          aws_r53_sub_domain_name: 'test'

      - name: Assert action ran (success or graceful failure with fake creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Install rsync
        run: |
          which rsync || (apt-get update -qq && apt-get install -y rsync)

      - name: Set up working directory for CDN/R53 script tests
        run: |
          # Use fixture scripts committed to the repo (not symlinks to host paths)
          FIXTURE_SCRIPTS="$GITHUB_WORKSPACE/tests/fixtures/scripts"
          mkdir -p /tmp/test-cdn/terraform_code
          mkdir -p /tmp/test-cdn/upload
          mkdir -p /tmp/test-cdn/scripts
          cp "$FIXTURE_SCRIPTS/generate_deploy.sh" /tmp/test-cdn/scripts/generate_deploy.sh
          cp "$FIXTURE_SCRIPTS/generate_identifier.sh" /tmp/test-cdn/scripts/generate_identifier.sh
          cp "$FIXTURE_SCRIPTS/generate_provider.sh" /tmp/test-cdn/scripts/generate_provider.sh
          cp "$FIXTURE_SCRIPTS/check_bucket_name.sh" /tmp/test-cdn/scripts/check_bucket_name.sh
          cp "$FIXTURE_SCRIPTS/create_tf_state_bucket.sh" /tmp/test-cdn/scripts/create_tf_state_bucket.sh
          chmod -R +x /tmp/test-cdn/scripts

      - name: Mock AWS CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/aws" << 'EOF'
          #!/bin/sh
          # Fake aws CLI - simulate success for s3api and s3 calls
          case "$*" in
            *s3api\ create-bucket*)
              echo '{"Location": "/test-bucket"}'
              exit 0
              ;;
            *s3api\ put-object*)
              exit 0
              ;;
            *s3\ rm*)
              exit 0
              ;;
            *)
              echo "Fake AWS CLI: $*" >&2
              exit 0
              ;;
          esac
          EOF
          chmod +x "$HOME/.local/bin/aws"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run generate_deploy.sh with CDN and R53 options
        env:
          GITHUB_REPOSITORY: 'testorg/testrepo'
          GITHUB_REF_NAME: 'main'
          GITHUB_HEAD_REF: ''
          GITHUB_ACTION_PATH: /tmp/test-cdn
          AWS_RESOURCE_IDENTIFIER: 'test-cdn-r53'
          AWS_DEFAULT_REGION: 'us-east-1'
          AWS_SITE_SOURCE_FOLDER: 'site'
          AWS_SITE_SOURCE_INCLUDE_HIDDEN: 'false'
          AWS_SITE_ROOT_OBJECT: 'index.html'
          AWS_SITE_ERROR_DOCUMENT: '404.html'
          AWS_SITE_CDN_ENABLED: 'true'
          AWS_SITE_CDN_MIN_TTL: '0'
          AWS_SITE_CDN_DEFAULT_TTL: '86400'
          AWS_SITE_CDN_MAX_TTL: '31536000'
          TF_STATE_BUCKET: 'test-cdn-r53-tf-state'
          TF_STATE_FILE_NAME: ''
          TF_STATE_FILE_NAME_APPEND: ''
          AWS_SITE_BUCKET_NAME: 'my-custom-bucket'
          AWS_SITE_CDN_ALIASES: ''
          AWS_SITE_CDN_CUSTOM_ERROR_CODES: ''
          AWS_SITE_CDN_RESPONSE_HEADERS_POLICY_ID: ''
          AWS_R53_DOMAIN_NAME: 'example.com'
          AWS_R53_SUB_DOMAIN_NAME: 'test'
          AWS_R53_ROOT_DOMAIN_DEPLOY: 'false'
          AWS_R53_CERT_ARN: ''
          AWS_R53_CREATE_ROOT_CERT: 'false'
          AWS_R53_CREATE_SUB_CERT: 'false'
          AWS_ADDITIONAL_TAGS: ''
        run: |
          bash /tmp/test-cdn/scripts/generate_deploy.sh
          echo "--- terraform.tfvars content ---"
          cat /tmp/test-cdn/terraform_code/terraform.tfvars
          echo "--- end ---"

      - name: Assert CDN is enabled in tfvars
        run: |
          TFVARS="/tmp/test-cdn/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_site_cdn_enabled = true' "$TFVARS"; then
            echo "FAIL: aws_site_cdn_enabled not set to true"
            cat "$TFVARS"
            exit 1
          fi
          echo "PASS: CDN enabled"

      - name: Assert R53 domain name is set in tfvars
        run: |
          TFVARS="/tmp/test-cdn/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_r53_domain_name = "example.com"' "$TFVARS"; then
            echo "FAIL: aws_r53_domain_name not found or incorrect"
            cat "$TFVARS"
            exit 1
          fi
          echo "PASS: R53 domain name set"

      - name: Assert R53 sub-domain name is set in tfvars
        run: |
          TFVARS="/tmp/test-cdn/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_r53_sub_domain_name = "test"' "$TFVARS"; then
            echo "FAIL: aws_r53_sub_domain_name not found or incorrect"
            cat "$TFVARS"
            exit 1
          fi
          echo "PASS: R53 sub-domain name set"

      - name: Assert custom bucket name is set in tfvars
        run: |
          TFVARS="/tmp/test-cdn/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_site_bucket_name = "my-custom-bucket"' "$TFVARS"; then
            echo "FAIL: aws_site_bucket_name not found or incorrect"
            cat "$TFVARS"
            exit 1
          fi
          echo "PASS: custom bucket name set"

      - name: Assert error document is set in tfvars
        run: |
          TFVARS="/tmp/test-cdn/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_site_error_document = "404.html"' "$TFVARS"; then
            echo "FAIL: aws_site_error_document not found or incorrect"
            cat "$TFVARS"
            exit 1
          fi
          echo "PASS: error document set"

      - name: Assert CDN TTL values are set in tfvars
        run: |
          TFVARS="/tmp/test-cdn/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_site_cdn_min_ttl = "0"' "$TFVARS"; then
            echo "FAIL: aws_site_cdn_min_ttl not found or incorrect"
            cat "$TFVARS"
            exit 1
          fi
          if ! grep -q 'aws_site_cdn_default_ttl = "86400"' "$TFVARS"; then
            echo "FAIL: aws_site_cdn_default_ttl not found or incorrect"
            cat "$TFVARS"
            exit 1
          fi
          if ! grep -q 'aws_site_cdn_max_ttl = "31536000"' "$TFVARS"; then
            echo "FAIL: aws_site_cdn_max_ttl not found or incorrect"
            cat "$TFVARS"
            exit 1
          fi
          echo "PASS: CDN TTL values set"
