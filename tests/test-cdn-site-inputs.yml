name: Test CDN, site settings, and Terraform action inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: myorg/myrepo
      GITHUB_REF_NAME: main
      GITHUB_HEAD_REF: ""
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with CDN and site inputs (will fail at Terraform without real AWS creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
          aws_default_region: us-east-1
          aws_site_source_folder: .
          aws_site_source_include_hidden: 'false'
          aws_site_root_object: index.html
          aws_site_error_document: error.html
          aws_site_bucket_name: my-custom-bucket
          aws_site_cdn_enabled: 'true'
          aws_site_cdn_aliases: cdn.example.com
          aws_site_cdn_custom_error_codes: '{"403":{"response_code":200,"response_page_path":"/index.html"}}'
          aws_site_cdn_response_headers_policy_id: 67f7725c-6f97-4210-82d7-5512b31e9d42
          aws_site_cdn_min_ttl: '0'
          aws_site_cdn_default_ttl: '86400'
          aws_site_cdn_max_ttl: '31536000'
          tf_action: plan
          tf_state_bucket_destroy: 'false'

      - name: Run generate_deploy.sh with CDN and site inputs
        id: generate_deploy
        env:
          GITHUB_ACTION_PATH: "${{ github.workspace }}"
          GITHUB_WORKSPACE: "${{ github.workspace }}"
          GITHUB_REPOSITORY: myorg/myrepo
          GITHUB_REF_NAME: main
          GITHUB_HEAD_REF: ""
          AWS_DEFAULT_REGION: us-east-1
          AWS_RESOURCE_IDENTIFIER: ""
          AWS_ADDITIONAL_TAGS: ""
          TF_STATE_BUCKET: myorg-myrepo-main-tf-state
          TF_STATE_FILE_NAME: ""
          TF_STATE_FILE_NAME_APPEND: ""
          TF_STATE_BUCKET_DESTROY: "false"
          AWS_SITE_SOURCE_FOLDER: .
          AWS_SITE_SOURCE_INCLUDE_HIDDEN: "false"
          AWS_SITE_ROOT_OBJECT: index.html
          AWS_SITE_ERROR_DOCUMENT: error.html
          AWS_SITE_BUCKET_NAME: my-custom-bucket
          AWS_SITE_CDN_ENABLED: "true"
          AWS_SITE_CDN_ALIASES: cdn.example.com
          AWS_SITE_CDN_CUSTOM_ERROR_CODES: '{"403":{"response_code":200,"response_page_path":"/index.html"}}'
          AWS_SITE_CDN_RESPONSE_HEADERS_POLICY_ID: 67f7725c-6f97-4210-82d7-5512b31e9d42
          AWS_SITE_CDN_MIN_TTL: "0"
          AWS_SITE_CDN_DEFAULT_TTL: "86400"
          AWS_SITE_CDN_MAX_TTL: "31536000"
          AWS_R53_DOMAIN_NAME: ""
          AWS_R53_SUB_DOMAIN_NAME: ""
          AWS_R53_ROOT_DOMAIN_DEPLOY: ""
          AWS_R53_CERT_ARN: ""
          AWS_R53_CREATE_ROOT_CERT: ""
          AWS_R53_CREATE_SUB_CERT: ""
        run: |
          bash "$GITHUB_WORKSPACE/scripts/generate_deploy.sh" || true

      - name: Assert terraform.tfvars was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars" ]; then
            echo "FAIL: terraform.tfvars was not created"
            exit 1
          fi
          echo "PASS: terraform.tfvars exists"
          echo "Contents:"
          cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"

      - name: Assert CDN enabled is in tfvars
        run: |
          if ! grep -q 'aws_site_cdn_enabled.*=.*true' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_site_cdn_enabled"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_site_cdn_enabled is correct"

      - name: Assert CDN aliases are in tfvars
        run: |
          if ! grep -q 'aws_site_cdn_aliases.*=.*"cdn.example.com"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_site_cdn_aliases"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_site_cdn_aliases is correct"

      - name: Assert CDN custom error codes are in tfvars
        run: |
          if ! grep -q 'aws_site_cdn_custom_error_codes' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_site_cdn_custom_error_codes"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_site_cdn_custom_error_codes is present"

      - name: Assert CDN response headers policy ID is in tfvars
        run: |
          if ! grep -q 'aws_site_cdn_response_headers_policy_id.*=.*"67f7725c-6f97-4210-82d7-5512b31e9d42"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_site_cdn_response_headers_policy_id"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_site_cdn_response_headers_policy_id is correct"

      - name: Assert CDN min TTL is in tfvars
        run: |
          if ! grep -q 'aws_site_cdn_min_ttl.*=.*"0"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_site_cdn_min_ttl"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_site_cdn_min_ttl is correct"

      - name: Assert CDN default TTL is in tfvars
        run: |
          if ! grep -q 'aws_site_cdn_default_ttl.*=.*"86400"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_site_cdn_default_ttl"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_site_cdn_default_ttl is correct"

      - name: Assert CDN max TTL is in tfvars
        run: |
          if ! grep -q 'aws_site_cdn_max_ttl.*=.*"31536000"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_site_cdn_max_ttl"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_site_cdn_max_ttl is correct"

      - name: Assert site root object is in tfvars
        run: |
          if ! grep -q 'aws_site_root_object.*=.*"index.html"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_site_root_object"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_site_root_object is correct"

      - name: Assert site error document is in tfvars
        run: |
          if ! grep -q 'aws_site_error_document.*=.*"error.html"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_site_error_document"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_site_error_document is correct"

      - name: Assert site bucket name is in tfvars
        run: |
          if ! grep -q 'aws_site_bucket_name.*=.*"my-custom-bucket"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_site_bucket_name"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_site_bucket_name is correct"

      - name: Assert action.yaml has tf_action input
        run: |
          if ! grep -q 'tf_action' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain tf_action input"
            exit 1
          fi
          echo "PASS: tf_action input is declared"

      - name: Assert action.yaml has tf_state_bucket_destroy input
        run: |
          if ! grep -q 'tf_state_bucket_destroy' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain tf_state_bucket_destroy input"
            exit 1
          fi
          echo "PASS: tf_state_bucket_destroy input is declared"

      - name: Assert action.yaml has aws_site_source_include_hidden input
        run: |
          if ! grep -q 'aws_site_source_include_hidden' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain aws_site_source_include_hidden input"
            exit 1
          fi
          echo "PASS: aws_site_source_include_hidden input is declared"
