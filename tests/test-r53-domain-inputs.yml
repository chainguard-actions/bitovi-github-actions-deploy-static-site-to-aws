name: Test R53 domain and AWS identity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: myorg/myrepo
      GITHUB_REF_NAME: main
      GITHUB_HEAD_REF: ""
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with R53 and identity inputs (will fail at Terraform without real AWS creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
          aws_default_region: us-east-1
          aws_role_to_assume: arn:aws:iam::123456789012:role/MyDeployRole
          aws_resource_identifier: my-custom-identifier
          aws_additional_tags: '{"env":"test","team":"platform"}'
          aws_site_source_folder: .
          aws_r53_domain_name: example.com
          aws_r53_sub_domain_name: myapp
          aws_r53_root_domain_deploy: 'false'
          aws_r53_cert_arn: arn:aws:acm:us-east-1:123456789012:certificate/abc123
          aws_r53_create_root_cert: 'false'
          aws_r53_create_sub_cert: 'false'

      - name: Run generate_deploy.sh with R53 inputs
        id: generate_deploy
        env:
          GITHUB_ACTION_PATH: "${{ github.workspace }}"
          GITHUB_WORKSPACE: "${{ github.workspace }}"
          GITHUB_REPOSITORY: myorg/myrepo
          GITHUB_REF_NAME: main
          GITHUB_HEAD_REF: ""
          AWS_DEFAULT_REGION: us-east-1
          AWS_RESOURCE_IDENTIFIER: my-custom-identifier
          AWS_ADDITIONAL_TAGS: '{"env":"test","team":"platform"}'
          TF_STATE_BUCKET: myorg-myrepo-main-tf-state
          TF_STATE_FILE_NAME: ""
          TF_STATE_FILE_NAME_APPEND: ""
          TF_STATE_BUCKET_DESTROY: ""
          AWS_SITE_SOURCE_FOLDER: .
          AWS_SITE_SOURCE_INCLUDE_HIDDEN: ""
          AWS_SITE_ROOT_OBJECT: ""
          AWS_SITE_ERROR_DOCUMENT: ""
          AWS_SITE_BUCKET_NAME: ""
          AWS_SITE_CDN_ENABLED: ""
          AWS_SITE_CDN_ALIASES: ""
          AWS_SITE_CDN_CUSTOM_ERROR_CODES: ""
          AWS_SITE_CDN_RESPONSE_HEADERS_POLICY_ID: ""
          AWS_SITE_CDN_MIN_TTL: ""
          AWS_SITE_CDN_DEFAULT_TTL: ""
          AWS_SITE_CDN_MAX_TTL: ""
          AWS_R53_DOMAIN_NAME: example.com
          AWS_R53_SUB_DOMAIN_NAME: myapp
          AWS_R53_ROOT_DOMAIN_DEPLOY: "false"
          AWS_R53_CERT_ARN: arn:aws:acm:us-east-1:123456789012:certificate/abc123
          AWS_R53_CREATE_ROOT_CERT: "false"
          AWS_R53_CREATE_SUB_CERT: "false"
        run: |
          bash "$GITHUB_WORKSPACE/scripts/generate_deploy.sh" || true

      - name: Assert terraform.tfvars was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars" ]; then
            echo "FAIL: terraform.tfvars was not created"
            exit 1
          fi
          echo "PASS: terraform.tfvars exists"
          echo "Contents:"
          cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"

      - name: Assert custom resource identifier is in tfvars
        run: |
          if ! grep -q 'aws_resource_identifier.*=.*"my-custom-identifier"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_resource_identifier"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_resource_identifier is correct"

      - name: Assert additional tags are in tfvars
        run: |
          if ! grep -q 'aws_additional_tags' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_additional_tags"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_additional_tags is present"

      - name: Assert R53 domain name is in tfvars
        run: |
          if ! grep -q 'aws_r53_domain_name.*=.*"example.com"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_r53_domain_name"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_r53_domain_name is correct"

      - name: Assert R53 sub-domain name is in tfvars
        run: |
          if ! grep -q 'aws_r53_sub_domain_name.*=.*"myapp"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_r53_sub_domain_name"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_r53_sub_domain_name is correct"

      - name: Assert R53 root domain deploy is in tfvars
        run: |
          if ! grep -q 'aws_r53_root_domain_deploy.*=.*false' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_r53_root_domain_deploy"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_r53_root_domain_deploy is correct"

      - name: Assert R53 cert ARN is in tfvars
        run: |
          if ! grep -q 'aws_r53_cert_arn' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_r53_cert_arn"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_r53_cert_arn is present"

      - name: Assert R53 create root cert is in tfvars
        run: |
          if ! grep -q 'aws_r53_create_root_cert.*=.*false' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_r53_create_root_cert"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_r53_create_root_cert is correct"

      - name: Assert R53 create sub cert is in tfvars
        run: |
          if ! grep -q 'aws_r53_create_sub_cert.*=.*false' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain expected aws_r53_create_sub_cert"
            cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
            exit 1
          fi
          echo "PASS: aws_r53_create_sub_cert is correct"

      - name: Assert action.yaml has aws_role_to_assume input
        run: |
          if ! grep -q 'aws_role_to_assume' "$GITHUB_WORKSPACE/action.yaml"; then
            echo "FAIL: action.yaml does not contain aws_role_to_assume input"
            exit 1
          fi
          echo "PASS: aws_role_to_assume input is declared"
