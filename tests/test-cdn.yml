name: Test CDN inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify CDN inputs are declared in action.yml
        run: |
          cdn_inputs=(
            "aws_site_cdn_enabled"
            "aws_site_cdn_aliases"
            "aws_site_cdn_custom_error_codes"
            "aws_site_cdn_response_headers_policy_id"
            "aws_site_cdn_min_ttl"
            "aws_site_cdn_default_ttl"
            "aws_site_cdn_max_ttl"
          )
          for input in "${cdn_inputs[@]}"; do
            if ! grep -q "$input" "$GITHUB_WORKSPACE/action.yml"; then
              echo "FAIL: CDN input '$input' not found in action.yml"
              exit 1
            fi
          done
          echo "PASS: all CDN inputs declared"
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIAIOSFODNN7EXAMPLE'
          aws_secret_access_key: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
          aws_default_region: 'us-east-1'
          aws_site_source_folder: 'dist'
          aws_site_cdn_enabled: 'true'
          aws_site_cdn_aliases: 'cdn.example.com,www.example.com'
          aws_site_cdn_custom_error_codes: '[{"error_code":404,"response_code":200,"response_page_path":"/index.html"}]'
          aws_site_cdn_response_headers_policy_id: '67f7725c-6f97-4210-82d7-5512b31e9d42'
          aws_site_cdn_min_ttl: '0'
          aws_site_cdn_default_ttl: '86400'
          aws_site_cdn_max_ttl: '31536000'
          tf_action: 'plan'
      - name: Assert action ran (may fail due to no real AWS creds)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: CDN action step executed (outcome may be failure due to missing AWS credentials in test environment)"
