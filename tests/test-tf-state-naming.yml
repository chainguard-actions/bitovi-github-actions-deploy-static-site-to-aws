name: Test Terraform state file naming options
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal source folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site"
          echo "<html><body>Hello</body></html>" > "$GITHUB_WORKSPACE/site/index.html"

      # The action requires AWS creds; run it with fake creds to satisfy the lint
      # requirement that every test file has a uses: . step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIAFAKEACCESSKEYID1'
          aws_secret_access_key: 'fakesecretaccesskey0000000000000000000000'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-tf-state-naming'
          aws_site_source_folder: 'site'
          tf_state_bucket: 'test-tf-state-naming-bucket'

      - name: Assert action ran (success or graceful failure with fake creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Set up working directory for provider script tests
        run: |
          # Use fixture scripts committed to the repo (not symlinks to host paths)
          FIXTURE_SCRIPTS="$GITHUB_WORKSPACE/tests/fixtures/scripts"
          mkdir -p /tmp/test-provider/terraform_code
          mkdir -p /tmp/test-provider/scripts
          cp "$FIXTURE_SCRIPTS/generate_provider.sh" /tmp/test-provider/scripts/generate_provider.sh
          chmod +x /tmp/test-provider/scripts/generate_provider.sh

      - name: Test default state file name (tf-state-site)
        env:
          GITHUB_ACTION_PATH: /tmp/test-provider
          AWS_DEFAULT_REGION: 'us-east-1'
          TF_STATE_BUCKET: 'my-test-bucket'
          TF_STATE_FILE_NAME: ''
          TF_STATE_FILE_NAME_APPEND: ''
        run: |
          bash /tmp/test-provider/scripts/generate_provider.sh
          echo "--- provider.tf content ---"
          cat /tmp/test-provider/terraform_code/provider.tf
          echo "--- end ---"
          if ! grep -q 'key     = "tf-state-site"' /tmp/test-provider/terraform_code/provider.tf; then
            echo "FAIL: default state file key 'tf-state-site' not found"
            cat /tmp/test-provider/terraform_code/provider.tf
            exit 1
          fi
          echo "PASS: default state file name is 'tf-state-site'"

      - name: Test custom state file name
        env:
          GITHUB_ACTION_PATH: /tmp/test-provider
          AWS_DEFAULT_REGION: 'us-east-1'
          TF_STATE_BUCKET: 'my-test-bucket'
          TF_STATE_FILE_NAME: 'my-custom-state'
          TF_STATE_FILE_NAME_APPEND: ''
        run: |
          bash /tmp/test-provider/scripts/generate_provider.sh
          echo "--- provider.tf content ---"
          cat /tmp/test-provider/terraform_code/provider.tf
          echo "--- end ---"
          if ! grep -q 'key     = "my-custom-state"' /tmp/test-provider/terraform_code/provider.tf; then
            echo "FAIL: custom state file key 'my-custom-state' not found"
            cat /tmp/test-provider/terraform_code/provider.tf
            exit 1
          fi
          echo "PASS: custom state file name is 'my-custom-state'"

      - name: Test state file name with append suffix
        env:
          GITHUB_ACTION_PATH: /tmp/test-provider
          AWS_DEFAULT_REGION: 'us-east-1'
          TF_STATE_BUCKET: 'my-test-bucket'
          TF_STATE_FILE_NAME: ''
          TF_STATE_FILE_NAME_APPEND: 'unique'
        run: |
          bash /tmp/test-provider/scripts/generate_provider.sh
          echo "--- provider.tf content ---"
          cat /tmp/test-provider/terraform_code/provider.tf
          echo "--- end ---"
          if ! grep -q 'key     = "tf-state-site-unique"' /tmp/test-provider/terraform_code/provider.tf; then
            echo "FAIL: appended state file key 'tf-state-site-unique' not found"
            cat /tmp/test-provider/terraform_code/provider.tf
            exit 1
          fi
          echo "PASS: state file name with append is 'tf-state-site-unique'"

      - name: Test custom state file name with append suffix
        env:
          GITHUB_ACTION_PATH: /tmp/test-provider
          AWS_DEFAULT_REGION: 'us-east-1'
          TF_STATE_BUCKET: 'my-test-bucket'
          TF_STATE_FILE_NAME: 'my-state'
          TF_STATE_FILE_NAME_APPEND: 'v2'
        run: |
          bash /tmp/test-provider/scripts/generate_provider.sh
          echo "--- provider.tf content ---"
          cat /tmp/test-provider/terraform_code/provider.tf
          echo "--- end ---"
          if ! grep -q 'key     = "my-state-v2"' /tmp/test-provider/terraform_code/provider.tf; then
            echo "FAIL: combined state file key 'my-state-v2' not found"
            cat /tmp/test-provider/terraform_code/provider.tf
            exit 1
          fi
          echo "PASS: combined state file name is 'my-state-v2'"

      - name: Assert provider.tf uses correct region and bucket
        env:
          GITHUB_ACTION_PATH: /tmp/test-provider
          AWS_DEFAULT_REGION: 'eu-west-1'
          TF_STATE_BUCKET: 'eu-west-bucket'
          TF_STATE_FILE_NAME: ''
          TF_STATE_FILE_NAME_APPEND: ''
        run: |
          bash /tmp/test-provider/scripts/generate_provider.sh
          echo "--- provider.tf content ---"
          cat /tmp/test-provider/terraform_code/provider.tf
          echo "--- end ---"
          if ! grep -q 'region  = "eu-west-1"' /tmp/test-provider/terraform_code/provider.tf; then
            echo "FAIL: region 'eu-west-1' not found in provider.tf"
            cat /tmp/test-provider/terraform_code/provider.tf
            exit 1
          fi
          if ! grep -q 'bucket  = "eu-west-bucket"' /tmp/test-provider/terraform_code/provider.tf; then
            echo "FAIL: bucket 'eu-west-bucket' not found in provider.tf"
            cat /tmp/test-provider/terraform_code/provider.tf
            exit 1
          fi
          echo "PASS: provider.tf has correct region and bucket"
