name: Test basic plan (fake AWS creds)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal source folder
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site"
          echo "<html><body>Hello</body></html>" > "$GITHUB_WORKSPACE/site/index.html"

      - id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: 'AKIAFAKEACCESSKEYID1'
          aws_secret_access_key: 'fakesecretaccesskey0000000000000000000000'
          aws_default_region: 'us-east-1'
          aws_resource_identifier: 'test-static-site-basic'
          aws_site_source_folder: 'site'
          tf_state_bucket: 'test-static-site-basic-tf-state'

      - name: Assert action ran and failed gracefully (no real AWS creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real AWS credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real AWS creds may be present)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
