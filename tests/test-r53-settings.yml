name: Test Route53 and certificate settings inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: myorg/myrepo
      GITHUB_REF_NAME: main
      GITHUB_HEAD_REF: ""
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with Route53 settings (will fail at Terraform without real AWS creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
          aws_default_region: us-east-1
          aws_site_source_folder: .
          aws_r53_domain_name: example.com
          aws_r53_sub_domain_name: myapp
          aws_r53_root_domain_deploy: 'false'
          aws_r53_cert_arn: arn:aws:acm:us-east-1:123456789012:certificate/abc123
          aws_r53_create_root_cert: 'false'
          aws_r53_create_sub_cert: 'false'

      - name: Run generate_deploy.sh with Route53 settings
        env:
          GITHUB_ACTION_PATH: "${{ github.workspace }}"
          GITHUB_REPOSITORY: myorg/myrepo
          GITHUB_REF_NAME: main
          GITHUB_HEAD_REF: ""
          AWS_DEFAULT_REGION: us-east-1
          AWS_RESOURCE_IDENTIFIER: ""
          AWS_ADDITIONAL_TAGS: ""
          TF_STATE_BUCKET: myorg-myrepo-main-tf-state
          TF_STATE_FILE_NAME: ""
          TF_STATE_FILE_NAME_APPEND: ""
          AWS_SITE_SOURCE_FOLDER: .
          AWS_SITE_SOURCE_INCLUDE_HIDDEN: ""
          AWS_SITE_ROOT_OBJECT: ""
          AWS_SITE_ERROR_DOCUMENT: ""
          AWS_SITE_BUCKET_NAME: ""
          AWS_SITE_CDN_ENABLED: ""
          AWS_SITE_CDN_ALIASES: ""
          AWS_SITE_CDN_CUSTOM_ERROR_CODES: ""
          AWS_SITE_CDN_RESPONSE_HEADERS_POLICY_ID: ""
          AWS_SITE_CDN_MIN_TTL: ""
          AWS_SITE_CDN_DEFAULT_TTL: ""
          AWS_SITE_CDN_MAX_TTL: ""
          AWS_R53_DOMAIN_NAME: "example.com"
          AWS_R53_SUB_DOMAIN_NAME: "myapp"
          AWS_R53_ROOT_DOMAIN_DEPLOY: "false"
          AWS_R53_CERT_ARN: "arn:aws:acm:us-east-1:123456789012:certificate/abc123"
          AWS_R53_CREATE_ROOT_CERT: "false"
          AWS_R53_CREATE_SUB_CERT: "false"
        run: |
          # Stub out create_tf_state_bucket.sh to avoid real AWS calls
          mkdir -p "$GITHUB_WORKSPACE/scripts_bak"
          cp "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh" "$GITHUB_WORKSPACE/scripts_bak/"
          echo '#!/bin/bash' > "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh"
          echo 'echo "Stubbed create_tf_state_bucket.sh"' >> "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh"
          chmod +x "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh"
          bash "$GITHUB_WORKSPACE/scripts/generate_deploy.sh"
          # restore
          cp "$GITHUB_WORKSPACE/scripts_bak/create_tf_state_bucket.sh" "$GITHUB_WORKSPACE/scripts/create_tf_state_bucket.sh"

      - name: Assert terraform.tfvars contains domain name
        run: |
          echo "Contents of terraform.tfvars:"
          cat "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"
          if ! grep -q 'aws_r53_domain_name.*=.*"example.com"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_r53_domain_name = example.com"
            exit 1
          fi
          echo "PASS: aws_r53_domain_name is set correctly"

      - name: Assert terraform.tfvars contains sub-domain name
        run: |
          if ! grep -q 'aws_r53_sub_domain_name.*=.*"myapp"' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_r53_sub_domain_name = myapp"
            exit 1
          fi
          echo "PASS: aws_r53_sub_domain_name is set correctly"

      - name: Assert terraform.tfvars contains root domain deploy setting
        run: |
          if ! grep -q 'aws_r53_root_domain_deploy.*=.*false' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_r53_root_domain_deploy = false"
            exit 1
          fi
          echo "PASS: aws_r53_root_domain_deploy is set correctly"

      - name: Assert terraform.tfvars contains certificate ARN
        run: |
          if ! grep -q 'aws_r53_cert_arn.*=.*"arn:aws:acm' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_r53_cert_arn"
            exit 1
          fi
          echo "PASS: aws_r53_cert_arn is set correctly"

      - name: Assert terraform.tfvars contains create root cert setting
        run: |
          if ! grep -q 'aws_r53_create_root_cert.*=.*false' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_r53_create_root_cert = false"
            exit 1
          fi
          echo "PASS: aws_r53_create_root_cert is set correctly"

      - name: Assert terraform.tfvars contains create sub cert setting
        run: |
          if ! grep -q 'aws_r53_create_sub_cert.*=.*false' "$GITHUB_WORKSPACE/terraform_code/terraform.tfvars"; then
            echo "FAIL: terraform.tfvars does not contain aws_r53_create_sub_cert = false"
            exit 1
          fi
          echo "PASS: aws_r53_create_sub_cert is set correctly"
